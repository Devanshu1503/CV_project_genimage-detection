# All paths, seeds, sample sizes and hyperparameters. Read via src/config.py.

project:
  name: genimage-detection
  seed: 42

# colab or local block is picked automatically
paths:
  colab:
    genimage_root: /content/drive/MyDrive/genimage            # raw split zips (read only)
    project_root: /content/drive/MyDrive/genimage_project     # our outputs, shared with team
    work_dir: /content/work                                   # local scratch, wiped on reset
  local:
    genimage_root: data/genimage
    project_root: data/genimage_project
    work_dir: data/work

project_subdirs: [manifests, raw_subset, processed, features, checkpoints, results, figures, logs]

# folder = name under genimage_root, name = label for plots
generators:
  - {folder: stable_diffusion_v_1_4, name: SD1.4}
  - {folder: stable_diffusion_v_1_5, name: SD1.5}
  - {folder: Midjourney, name: Midjourney}
  - {folder: wukong, name: Wukong}
  - {folder: ADM, name: ADM}
  - {folder: glide, name: GLIDE}
  - {folder: VQDM, name: VQDM}
  - {folder: BigGAN, name: BigGAN}

train_generator: stable_diffusion_v_1_4

seven_zip:
  binary: auto                 # tries 7z, 7zz, 7za
  list_timeout_sec: 3600
  extract_timeout_sec: 2400     # per 7z batch call, 7z is killed after this
  extract_batch_size: 1000     # files per 7z call
  extract_workers: 6           # parallel 7z processes
  copy_local_generators: []    # e.g. [stable_diffusion_v_1_4], copy archive to local disk first
  local_copy_margin_gb: 15     # disk to keep free when copying locally
  speed_test_n_per_label: 50

sampling:
  train_split_name: train
  test_split_name: val
  train_per_label: 5000        # SD1.4 train: 5000 ai + 5000 nature
  test_per_label: 500          # per generator val: 500 + 500
  stratify_by_class: true
  drive_budget_gb: 6.0

dedup:
  phash_size: 8                # 64-bit hash
  near_dup_hamming: 4
  n_threads: 8

# same pipeline for real and fake
preprocess:
  image_size: 224
  resample: bicubic
  jpeg_quality: 96             # close to the real ImageNet JPEGs
  jpeg_subsampling: "4:2:0"
  n_threads: 8

eda:
  pixel_stats_per_group: 300
  pixel_stats_max_side: 256
  fft_crop: 128                # crop, no resize (BigGAN is 128px)
  fft_per_group: 200
  grid_n: 8
  cv_folds: 5

split:
  val_fraction: 0.2

models:
  clip:
    hf_id: openai/clip-vit-large-patch14
  dinov2:
    hf_id: facebook/dinov2-base

features:
  batch_size: 64
  shard_size: 2000
  num_workers: 2

training:
  copy_processed_to_local: true
  resnet50:
    weights: IMAGENET1K_V2
    epochs: 5
    batch_size: 64
    lr: 0.0001
    weight_decay: 0.0001
    crop_size: 192             # random/center crop, no resize
    early_stopping_patience: 2
    num_workers: 2
    amp: true
  linear_probe:
    C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
    max_iter: 5000

evaluation:
  threshold: 0.5

# Problem 1 extras (notebook 04)
gradcam:
  layer: layer4                # model.layer4[-1], 6x6 map at 192 px input
  gallery_generators: [stable_diffusion_v_1_4, Midjourney, ADM, BigGAN]
  n_per_cell: 4                # images per (generator, outcome) in the gallery
  n_mean_per_generator: 100    # fakes + reals per generator for mean heatmaps / stats
  deletion_frac: 0.2           # share of pixels blanked in the deletion test
  batch_size: 32

bootstrap:
  n_boot: 1000
  alpha: 0.05

# Problem 2 degradation tests (notebook 06)
problem2:
  # name: [[kind, level], ...], applied to real AND fake test images
  conditions:
    clean: []
    jpeg95: [[jpeg, 95]]
    jpeg85: [[jpeg, 85]]
    jpeg75: [[jpeg, 75]]
    jpeg60: [[jpeg, 60]]
    jpeg50: [[jpeg, 50]]
    resize0.5: [[resize, 0.5]]   # down then back up to 224
    resize0.75: [[resize, 0.75]]
    resize1.5: [[resize, 1.5]]
    blur1: [[blur, 1.0]]         # gaussian sigma
    blur2: [[blur, 2.0]]
    noise5: [[noise, 5]]         # std in 0-255 units
    noise10: [[noise, 10]]
    social: [[resize, 0.75], [jpeg, 75]]   # rough "re-uploaded" image
